---
# Red Hat build of Kueue (RHBoK) operator. AllNamespaces install mode only —
# install into the global operators namespace.
#
# CHANNEL PIN: Kubeflow Trainer v2 is NOT compatible with RHBoK 1.4+ — use
# stable-v1.3 (see the kubeflow-trainer-v2 lab and the cluster README).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kueue-operator
  namespace: openshift-operators
spec:
  channel: stable-v1.3
  installPlanApproval: Automatic
  name: kueue-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
