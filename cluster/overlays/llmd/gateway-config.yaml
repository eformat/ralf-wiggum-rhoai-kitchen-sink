---
# Service parameters for the openshift-ai-inference Gateway (data-science-gateway-class
# convention: <gateway-name>-config). The Service is created as LoadBalancer — on clusters
# WITHOUT a cloud LB provider it still gets a ClusterIP, and a Route (route.yaml) fronts it
# externally. After applying, patch status.loadBalancer.ingress with the Route hostname so
# the Gateway reports Programmed=True (make -C cluster gateway-status).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-ai-inference-config
  namespace: openshift-ingress
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "openshift-ai-inference-gw-service-tls"
    spec:
      type: LoadBalancer
