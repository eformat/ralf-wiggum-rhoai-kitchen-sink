---
# ClusterIP mode — for clusters WITHOUT a LoadBalancer provider (RHDP
# workshop clusters, bare-metal). Uses data-science-gateway-class (the same
# class as RHOAI's built-in data-science-gateway) so the external Route
# hostname is properly exposed in gateway.status.addresses.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshift-ai-inference
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: llm-d
    app.kubernetes.io/component: inference-gateway
spec:
  gatewayClassName: data-science-gateway-class
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: openshift-ai-inference-config
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          # Service-provisioned TLS cert (annotation on the Service in the ConfigMap).
          - group: ""
            kind: Secret
            name: openshift-ai-inference-gw-service-tls
