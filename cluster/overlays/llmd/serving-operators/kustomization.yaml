---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Serving-path operators for LLMInferenceService (llm-d) pods: Leader Worker Set
# and JobSet. Kubeflow Trainer v2 (overlays/distributed) also needs JobSet —
# apply this overlay (or serving + llmd) before the trainer labs.
resources:
  - jobset-namespace.yaml
  - jobset-operatorgroup.yaml
  - jobset-subscription.yaml
  - lws-namespace.yaml
  - lws-operatorgroup.yaml
  - lws-subscription.yaml
