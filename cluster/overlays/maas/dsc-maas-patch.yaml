---
# Strategic-merge patch enabling MaaS on the DataScienceCluster (RHOAI 3.5+).
# In 3.5 MaaS is managed by the aigateway component (not kserve.modelsAsService).
#
# ORDER MATTERS: apply only after RHCL + Kuadrant are Ready and the
# maas-default-gateway exists (overlays/gateway + the gateway/ dir here) —
# flipping modelsAsAService before the gateway is in place yields
# AIGatewayReady=False at install.
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  namespace: redhat-ods-operator
spec:
  components:
    aigateway:
      managementState: Managed
      modelsAsAService:
        managementState: Managed
