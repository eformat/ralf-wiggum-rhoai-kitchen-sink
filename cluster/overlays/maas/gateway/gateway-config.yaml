---
# Service parameters for the maas-default-gateway (data-science-gateway-class
# convention: <gateway-name>-config). LoadBalancer type so it gets a ClusterIP on
# clusters without a cloud LB; a Route (route.yaml) fronts it externally. After
# applying, patch status.loadBalancer.ingress with the Route hostname so the
# Gateway reports Programmed=True (make -C cluster gateway-status).
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-default-gateway-config
  namespace: openshift-ingress
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "maas-gw-service-tls"
    spec:
      type: LoadBalancer
