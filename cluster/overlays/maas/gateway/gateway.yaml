---
# ClusterIP mode — for clusters WITHOUT a LoadBalancer provider (RHDP
# workshop clusters, bare-metal). Uses data-science-gateway-class so the
# external Route hostname is exposed in gateway.status.addresses (the maas-api
# reads gateway.status.addresses to discover its external URL).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # The MaaS controller hardcodes this name/namespace (GATEWAY env) — do not rename.
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    opendatahub.io/managed: "false"
    # Lets the ODH/Authorino stack bootstrap gateway TLS wiring automatically.
    security.opendatahub.io/authorino-tls-bootstrap: "true"
  labels:
    app.kubernetes.io/name: maas
    app.kubernetes.io/instance: maas-default-gateway
    app.kubernetes.io/component: gateway
    kuadrant.io/gateway: "true"
spec:
  gatewayClassName: data-science-gateway-class
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: maas-default-gateway-config
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: maas-gw-service-tls
