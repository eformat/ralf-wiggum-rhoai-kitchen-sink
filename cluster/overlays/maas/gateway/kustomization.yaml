---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# maas-default-gateway: ClusterIP mode (no LoadBalancer provider on RHDP/bare-metal).
# route.yaml carries ${CLUSTER_DOMAIN}, so apply with envsubst (see ../kustomization.yaml).
resources:
  - gateway-config.yaml
  - gateway.yaml
  - route.yaml
