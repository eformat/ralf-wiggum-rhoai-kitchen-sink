---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MaaS PostgreSQL database. The maas-api needs its database BEFORE MaaS is
# enabled, or maas-api crash-loops.
#
# NOTE: the postgres-creds and maas-db-config secrets are created imperatively
# (they must not live in git). Run `make maas-secrets` first.
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
