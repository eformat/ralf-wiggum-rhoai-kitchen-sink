---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Observability backend: Cluster Observability Operator + Red Hat build of
# OpenTelemetry. Once their CSVs Succeed and DSCI monitoring is Managed (base),
# the RHOAI operator brings up the MonitoringStack and Perses so the
# observabilityDashboard tab renders instead of "Service Unavailable".
resources:
  - ../../base
  - uwm-cluster-monitoring-config.yaml
  - observability-operators
