---
# Cluster Observability Operator (COO) — provides the MonitoringStack and Perses
# backend the RHOAI dashboard's "Observe & monitor → Dashboard" renders from.
# Without it the tab loads but reports "Service Unavailable".
#
# COO only supports the AllNamespaces install mode, so the OperatorGroup has an
# empty spec (global). Do NOT add targetNamespaces here.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
