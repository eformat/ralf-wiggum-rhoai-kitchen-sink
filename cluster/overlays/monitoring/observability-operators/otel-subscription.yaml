---
# Red Hat build of OpenTelemetry (package: opentelemetry-product). Required
# alongside COO for the RHOAI observability dashboard backend and the MaaS
# telemetry pipeline.
#
# AllNamespaces install mode only — OperatorGroup has an empty spec (global).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opentelemetry-product
  namespace: openshift-opentelemetry-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: opentelemetry-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
