# PostgreSQL credentials the EvalHub CR references (spec.database.secret).
# Not a secret-key leak: placeholder workshop credentials, no AWS values.
apiVersion: v1
kind: Secret
metadata:
  name: evalhub-db-credentials
  namespace: p2w15-evalhub
type: Opaque
stringData:
  database: evalhub
  username: evalhub
  password: evalhub-workshop-change-me
