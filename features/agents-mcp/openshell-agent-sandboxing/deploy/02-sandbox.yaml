# Sandbox custom resource (agent deployment) for the openshell-agent-sandboxing workshop.
# Part 2 of the deploy flow — apply AFTER 01-agent-sandbox-manifest.yaml (the CRD must exist first).
# This is the OpenShell-managed Sandbox CR that the RHOAI dashboard's running agent
# deployments view (Agents -> Deployments tab) lists and that the sandbox controller
# turns into the sandboxed agent pod.
#
# The dashboard's agent-ops backend lists Sandboxes at group agents.x-k8s.io/v1beta1
# with label selector openshell.ai/managed-by=openshell — the label is REQUIRED for the
# entry to appear. Display name, description, and framework come from the annotations.
#
# The podTemplate.metadata label mirrors the same key onto the POD, where the
# osh15-controlled-egress NetworkPolicy (04-egress-networkpolicy.yaml) selects it.
#
# The container runs a periodic egress probe against https://example.com so the
# controlled-egress payoff is visible in the pod logs: with the NetworkPolicy applied
# the probe cannot leave the sandbox (curl exit 28), and the control pod running the
# identical probe (03-egress-control-pod.yaml) still succeeds.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: osh15-agent-runtime
  labels:
    # The agent-ops backend lists only sandboxes matching this selector.
    openshell.ai/managed-by: openshell
  annotations:
    # The columns shown in the dashboard's Deployments view.
    openshift.io/display-name: osh15-agent-runtime
    openshift.io/description: Workshop agent runtime deployed as an OpenShell-managed Sandbox CR
    opendatahub.io/agent-framework: LangGraph
spec:
  podTemplate:
    metadata:
      labels:
        # Mirrors the managed-by key onto the pod so the controlled-egress
        # NetworkPolicy selects the sandboxed agent pod.
        openshell.ai/managed-by: openshell
    spec:
      containers:
      - name: agent-runtime
        image: curlimages/curl:8.11.1
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            code=$(curl -sS -m 6 -o /dev/null -w "%{http_code}" https://example.com 2>/dev/null)
            rc=$?
            ts=$(date +%H:%M:%S)
            if [ "$rc" -eq 0 ]; then
              echo "[$ts] egress https://example.com -> HTTP $code"
            else
              echo "[$ts] egress https://example.com -> BLOCKED (curl exit $rc)"
            fi
            sleep 25
          done
