# Egress-allowed control pod for the openshell-agent-sandboxing workshop.
# Part 3 of the deploy flow — runs in the SAME project as the sandboxed agent pod
# but WITHOUT the openshell.ai/managed-by pod label, so the osh15-controlled-egress
# NetworkPolicy (04-egress-networkpolicy.yaml) does not select it.
#
# It runs the IDENTICAL egress probe as the sandboxed agent pod (02-sandbox.yaml),
# so the pod logs give the contrast the controlled-egress payoff needs:
#   - control pod (this pod):     egress https://example.com -> HTTP 200
#   - sandboxed agent pod:        egress https://example.com -> BLOCKED (curl exit 28)
apiVersion: v1
kind: Pod
metadata:
  name: osh15-egress-allowed
  labels:
    app: osh15-egress-allowed
spec:
  restartPolicy: Always
  containers:
  - name: egress-allowed
    image: curlimages/curl:8.11.1
    command: ["/bin/sh", "-c"]
    args:
    - |
      while true; do
        code=$(curl -sS -m 6 -o /dev/null -w "%{http_code}" https://example.com 2>/dev/null)
        rc=$?
        ts=$(date +%H:%M:%S)
        if [ "$rc" -eq 0 ]; then
          echo "[$ts] egress https://example.com -> HTTP $code"
        else
          echo "[$ts] egress https://example.com -> BLOCKED (curl exit $rc)"
        fi
        sleep 25
      done
