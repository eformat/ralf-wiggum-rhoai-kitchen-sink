apiVersion: v1
kind: Pod
metadata:
  name: p2w15-garak-verify
  namespace: p2w13-autorag
  labels:
    app: p2w15-garak-verify
spec:
  containers:
    - name: verify
      image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: PIP_CERT
          value: /etc/pki/odh/ca-bundle.crt
        - name: SSL_CERT_FILE
          value: /etc/pki/odh/ca-bundle.crt
        - name: REQUESTS_CA_BUNDLE
          value: /etc/pki/odh/ca-bundle.crt
      volumeMounts:
        - name: trusted-ca
          mountPath: /etc/pki/odh
          readOnly: true
  volumes:
    - name: trusted-ca
      configMap:
        name: odh-trusted-ca-bundle
  restartPolicy: Never
