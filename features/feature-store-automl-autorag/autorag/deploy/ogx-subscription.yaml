# OLM fallback for an OperatorHub-packaged OGX operator.
#
# NOT APPLIED ON THIS BUILD (cluster-qn8tx, batch p2w14): the OGX operator
# ships as a component of the rhods-operator CSV and is provisioned by the
# DataScienceCluster ogx module machinery — there is NO `ogx` package in the
# redhat-operators catalog on this build (oc get packagemanifest ogx -n
# openshift-marketplace -> NotFound out of 630 catalog packages), so this
# Subscription could never resolve and was left unapplied. See deploy/README.md
# for the live evidence and the install path that was actually used.
#
# If a future build ships OGX as an OLM package (package `ogx`, channel
# `preview`), apply this file with:
#
#   oc apply -f ogx-subscription.yaml
#   oc wait --for=jsonpath={.status.installPlanRef.name} subscription/ogx -n redhat-ods-applications --timeout=120s
#   plan=$(oc get subscription/ogx -n redhat-ods-applications -o jsonpath={.status.installPlanRef.name})
#   oc wait --for=condition=Installed installplan -n redhat-ods-applications ${plan} --timeout=300s
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ogx
  namespace: redhat-ods-applications
spec:
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  name: ogx
  channel: preview
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: ogx
  namespace: redhat-ods-applications
spec:
  targetNamespaces:
    - redhat-ods-applications
