# Submit pod for the AutoRAG stack re-triage (cluster-qn8tx, batch p2w13).
#
# python:3.9-slim pod with the submit-script ConfigMap (its own file,
# submit-script-cm.yaml — CMs defined INSIDE pod manifests revert on every pod
# apply) + the odh-trusted-ca-bundle CA mount (pypi egress needs the proxy CA).
#
# NOTEBOOK IMAGE DELTA (batch p2w14): the KFP step this submits pulls the
# cluster-internal ImageStream image s2i-generic-data-science-notebook:3.5 —
# the upstream registry.redhat.io notebook repo is not authorized with this
# cluster's pull secret.
apiVersion: v1
kind: Pod
metadata:
  name: p2w13-autorag-submit
  namespace: p2w13-autorag
spec:
  containers:
  - command:
    - sh
    - -c
    - mkdir -p /tmp/scripts /tmp/home && cp /tmp/config/*.py /tmp/config/*.sh /tmp/scripts/
      && sh /tmp/scripts/setup.sh
    env:
    - name: HOME
      value: /tmp/home
    - name: REQUESTS_CA_BUNDLE
      value: /tmp/ca/ca-bundle.crt
    - name: SSL_CERT_FILE
      value: /tmp/ca/ca-bundle.crt
    image: python:3.9-slim
    name: submit
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - mountPath: /tmp/config
      name: script
    - mountPath: /tmp/ca
      name: ca
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: p2w13-autorag-submit
  volumes:
  - configMap:
      name: p2w13-autorag-submit-script
    name: script
  - configMap:
      items:
      - key: ca-bundle.crt
        path: ca-bundle.crt
      name: odh-trusted-ca-bundle
    name: ca
