# Provider API key secret (module-01 exercise 3) + managed label.
# The key value is a DUMMY placeholder — the stand-in endpoint ignores
# credentials; with a real provider put a genuine Anthropic key here
# (never commit real credentials).
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-api-key
  namespace: p2w15-llm
  labels:
    inference.llm-d.ai/ipp-managed: "true"
type: Opaque
stringData:
  api-key: sk-ant-DUMMY-PLACEHOLDER-REPLACE
