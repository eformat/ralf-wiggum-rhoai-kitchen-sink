<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaaS external OIDC — the tenant, the CR, and the provider</title>
<style>
/* ===========================================================
   Arcade-style demo player — reverse engineered from
   arcade.software player DOM (area-border spotlight + camera).
   Recording space: 1920x1080 ("recording coords" everywhere).
   =========================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #EE0000;                       /* Red Hat red, as the Arcade demo */
  --accent-soft: rgba(238, 0, 0, 0.12);
  --marker: #6D5AE6;                       /* Arcade purple marker */
  --dim: rgba(17, 24, 39, 0.25);           /* exact Arcade scrim */
  --chrome-bg: rgba(21, 21, 21, 0.92);
  --chrome-fg: #f0f0f0;
  --chrome-dim: #9a9a9a;
  --border: #3a3a3a;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --zoom-dur: 0.7s;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: #0b0b0c;
  font-family: 'Red Hat Display', 'Segoe UI', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ── Stage: recording space scaled to fit the window ── */
#stage { position: absolute; inset: 0; }

#frame {
  position: absolute; top: 50%; left: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%);
  background: #111;
  border-radius: 8px;
  overflow: hidden;                        /* clips the spotlight's punch-out dim */
  box-shadow: 0 30px 90px rgba(0,0,0,.6);
}

#frame.picking { cursor: crosshair; }

/* ── Camera: zoom layer, everything scene-related lives inside ── */
#camera {
  position: absolute; top: 0; left: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  transition: transform var(--zoom-dur) var(--ease);
  will-change: transform;
}

/* ── Scene frames (crossfade stack) ── */
.scene {
  position: absolute; top: 0; left: 0;
  width: 1920px; height: 1080px;
  opacity: 0;
  transition: opacity 0.35s ease;
  image-rendering: auto;
}
.scene.on { opacity: 1; }

/* Video mode (optional): mp4 plays between cues, pauses at each */
#video {
  position: absolute; top: 0; left: 0;
  width: 1920px; height: 1080px;
  display: none;
}

/* ── Spotlight: Arcade area-border. The dim is a box-shadow punch-out
      (equivalent of Arcade's evenodd SVG path), border 6px red with 12px
      radius like the extracted player DOM. Rides INSIDE the camera so it
      stays anchored to the UI element while zooming. ── */
#spot {
  position: absolute;
  pointer-events: none;
  opacity: 0;
  border: 6px solid var(--accent);
  border-radius: 12px;
  box-shadow: 0 0 0 4000px var(--dim);     /* the evenodd dim */
  transition:
    opacity 0.18s ease-out,
    left   var(--zoom-dur) var(--ease),
    top    var(--zoom-dur) var(--ease),
    width  var(--zoom-dur) var(--ease),
    height var(--zoom-dur) var(--ease),
    border-width var(--zoom-dur) var(--ease),
    border-radius var(--zoom-dur) var(--ease);
}
#spot.on { opacity: 1; }

/* ── Pulsing marker (Arcade purple dot + expanding ring) ── */
#marker {
  position: absolute;
  pointer-events: none;
  opacity: 0;
  transition:
    opacity 0.3s ease,
    left var(--zoom-dur) var(--ease),
    top   var(--zoom-dur) var(--ease);
}
#marker.on { opacity: 1; }
#marker .dot {
  position: absolute; top: 50%; left: 50%;
  width: 18px; height: 18px;
  transform: translate(-50%, -50%);
  background: var(--marker);
  border: 3px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(109, 90, 230, 0.35);
}
#marker .ring {
  position: absolute; top: 50%; left: 50%;
  width: 30px; height: 30px;
  transform: translate(-50%, -50%);
  border: 3px solid var(--marker);
  border-radius: 50%;
  animation: pulse 1.6s ease-out infinite;
}
@keyframes pulse {
  0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
}

/* ── Chrome: caption, pills, panel, controls — OUTSIDE the camera so
      text stays crisp at any zoom (scales with the stage only) ── */

#caption {
  position: absolute;
  bottom: 64px; left: 50%;
  transform: translateX(-50%);
  max-width: 1400px;
  padding: 14px 34px;
  background: var(--chrome-bg);
  color: var(--chrome-fg);
  border: 1px solid var(--border);
  border-radius: 14px;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.01em;
  white-space: nowrap;
  opacity: 1;
  transition: opacity 0.22s ease;
  z-index: 20;
}
#caption.swap { opacity: 0; }

#pills {
  position: absolute;
  bottom: 40px; left: 40px;
  display: flex; gap: 8px;
  align-items: center;
  z-index: 20;
}
.pill {
  height: 12px;
  width: 26px;
  border-radius: 6px;
  background: rgba(240, 240, 240, 0.22);
  border: none;
  cursor: pointer;
  padding: 0;
  transition: width 0.3s var(--ease), background 0.3s ease;
}
.pill.done { background: rgba(109, 90, 230, 0.55); }
.pill.cur  { width: 72px; background: var(--marker); }
.pill:hover { background: var(--marker); }

#controls {
  position: absolute;
  bottom: 34px; right: 40px;
  display: flex; gap: 10px;
  z-index: 20;
}
.btn {
  min-width: 46px; height: 46px;
  padding: 0 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--chrome-bg);
  color: var(--chrome-fg);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 19px;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.btn:hover { background: #2a2a2a; border-color: #555; }
.btn.on { border-color: var(--marker); color: #fff; background: rgba(109, 90, 230, 0.25); }

#hud {
  position: absolute;
  top: 28px; left: 36px;
  display: flex; gap: 14px; align-items: baseline;
  z-index: 20;
  pointer-events: none;
}
#hud .title {
  color: var(--chrome-fg);
  font-size: 22px; font-weight: 700; letter-spacing: 0.02em;
  text-shadow: 0 1px 8px rgba(0,0,0,.8);
}
#hud .count {
  color: var(--chrome-dim);
  font-size: 19px; font-weight: 600;
  font-family: 'Red Hat Mono', 'Courier New', monospace;
  text-shadow: 0 1px 8px rgba(0,0,0,.8);
}

/* ── Detail panel: Arcade's right slide-in, with Hide details ── */
#panel {
  position: absolute;
  top: 96px; right: 40px;
  width: 460px;
  max-height: 760px;
  overflow: auto;
  background: rgba(250, 250, 250, 0.97);
  color: #1a1a1a;
  border-radius: 14px;
  box-shadow: 0 18px 60px rgba(0,0,0,.45);
  transform: translateX(120%);
  transition: transform 0.35s var(--ease);
  z-index: 20;
}
#panel.open { transform: translateX(0); }
#panel .panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 12px;
}
#panel .panel-head h3 {
  font-size: 17px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: #555;
}
#panel .hide {
  border: 1px solid #d5d5d5; background: #fff; color: #333;
  border-radius: 8px; font-size: 14px; font-weight: 600;
  padding: 6px 12px; cursor: pointer; font-family: inherit;
}
#panel .hide:hover { background: #f0f0f0; }
#panel dl { padding: 4px 22px 20px; }
#panel .row {
  display: flex; gap: 16px;
  padding: 11px 0;
  border-top: 1px solid #ececec;
  font-size: 16.5px;
  line-height: 1.45;
}
#panel .row:first-child { border-top: none; }
#panel dt { flex: 0 0 165px; color: #666; font-weight: 600; }
#panel dd { flex: 1; color: #111; font-family: 'Red Hat Mono', 'Courier New', monospace; font-size: 14.5px; word-break: break-word; }

/* ── Picker mode (authoring): drag a rect, get paste-ready config JSON ── */
#pickBox {
  position: absolute;
  border: 2px dashed var(--accent);
  background: var(--accent-soft);
  border-radius: 4px;
  display: none;
  pointer-events: none;
  z-index: 15;
}
#pickHint {
  position: absolute;
  top: 28px; left: 50%;
  transform: translateX(-50%);
  padding: 10px 22px;
  background: rgba(238, 0, 0, 0.92);
  color: #fff;
  border-radius: 10px;
  font-size: 17px; font-weight: 600;
  display: none;
  z-index: 30;
  pointer-events: none;
}
#frame.picking #pickHint { display: block; }

#pickLog {
  position: absolute;
  bottom: 100px; right: 40px;
  width: 520px;
  max-height: 300px;
  overflow: auto;
  background: rgba(12, 12, 14, 0.95);
  color: #7ee787;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: 'Red Hat Mono', 'Courier New', monospace;
  font-size: 13.5px;
  line-height: 1.6;
  padding: 12px 16px;
  display: none;
  white-space: pre;
  z-index: 30;
}
#pickLog.on { display: block; }

.scene, #video { pointer-events: none; user-select: none; -webkit-user-drag: none; }

/* keyboard hint */
#keys {
  position: absolute;
  bottom: 40px; left: 50%;
  transform: translateX(-50%);
  bottom: 6px;
  color: rgba(240,240,240,0.35);
  font-size: 14px;
  letter-spacing: 0.04em;
  z-index: 20;
  pointer-events: none;
}
</style>
</head>

</div>

/* ── State ── */
const W = DATA.videoW || 1920, H = DATA.videoH || 1080;
const DWELL = DATA.dwell || 4.2;
const steps = DATA.steps;
let cur = -1;
let SCALE = 1;
let playing = false;
let playTimer = null;
let picking = false;
let userPanel = null;          // null = auto-open per step, true/false = user override
let sceneFlip = false;         // which scene layer is on top

const $ = (id) => document.getElementById(id);
const frameEl = $('frame'), camEl = $('camera'),
      spotEl = $('spot'), markerEl = $('marker'),
      capEl = $('caption'), pillsEl = $('pills'), panelEl = $('panel'),
      rowsEl = $('rows'), pickBoxEl = $('pickBox'), pickLogEl = $('pickLog'),
      videoEl = $('video'), sceneA = $('sceneA'), sceneB = $('sceneB');

/* ── Stage sized to the recording resolution (W/H from DATA) ──
   The CSS hard-codes 1920x1080; the stage must match DATA.videoW/H
   or the frame content is squeezed while spotlight/marker/camera
   coordinates stay in recording pixels. */
for (const el of [frameEl, camEl, sceneA, sceneB, videoEl]) {
  el.style.width = W + 'px';
  el.style.height = H + 'px';
}

/* ── Layout: fit the recording space into the window ── */
function layout() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.985;
  SCALE = s;
  frameEl.style.transform = `translate(-50%, -50%) scale(${s})`;
}
window.addEventListener('resize', layout);

/* ── Zoom math: frame the target rect at ~55% of the stage ── */
function computeZoom(step) {
  if (!step.target) return { s: 1, tx: 0, ty: 0 };
  const r = step.target;
  const maxS = step.zoomMax || 2.5;
  let s = Math.min(0.55 * W / r.w, 0.55 * H / r.h, maxS);
  if (s < 1) s = 1;                        // wide rects: recenter only
  const tx = W / 2 - s * (r.x + r.w / 2);
  const ty = H / 2 - s * (r.y + r.h / 2);
  return { s, tx, ty };
}

/* ── Scene swap (poster crossfade; video mode is driven by goTo) ── */
function showScene(step) {
  if (DATA.embedVideo && DATA.videoSrc) {
    videoEl.style.display = 'block';
    sceneA.style.display = sceneB.style.display = 'none';
    return;
  }
  const showEl = sceneFlip ? sceneA : sceneB;
  const hideEl = sceneFlip ? sceneB : sceneA;
  showEl.src = step.src || '';
  showEl.classList.add('on');
  hideEl.classList.remove('on');
  sceneFlip = !sceneFlip;
}

/* ── Go to a step: camera + spotlight + marker + chrome, all in sync ── */
let seekSeq = 0;

function goTo(i, opts = {}) {
  i = Math.max(0, Math.min(steps.length - 1, i));
  if (i === cur && !opts.force) return;
  cur = i;
  const step = steps[i];
  const { s, tx, ty } = computeZoom(step);

  /* overlays: camera + spotlight + marker + caption + pills + hud + panel.
     In video mode these are applied on the video's `seeked` event so the
     highlight switches exactly when the frame does. */
  const applyOverlays = () => {
    camEl.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;

    /* spotlight: anchored to the element, rides the camera;
       compensate border + radius so they read 6px / 12px on screen */
    if (step.target) {
      const r = step.target;
      spotEl.style.left = r.x + 'px';
      spotEl.style.top = r.y + 'px';
      spotEl.style.width = r.w + 'px';
      spotEl.style.height = r.h + 'px';
      spotEl.style.borderWidth = Math.max(1.5, 6 / s) + 'px';
      spotEl.style.borderRadius = (12 / s) + 'px';
      spotEl.classList.add('on');
    } else {
      spotEl.classList.remove('on');
    }

    /* marker (default: target center; marker:false disables) */
    const mk = step.marker === false ? null : (step.marker || (step.target && { x: step.target.x + step.target.w / 2, y: step.target.y + step.target.h / 2 }));
    if (mk) {
      markerEl.style.left = mk.x + 'px';
      markerEl.style.top = mk.y + 'px';
      markerEl.style.transform = `scale(${1 / Math.max(1, s * 0.75)})`;
      markerEl.classList.add('on');
    } else {
      markerEl.classList.remove('on');
    }

    /* caption crossfade */
    capEl.classList.add('swap');
    setTimeout(() => { capEl.textContent = step.caption || ''; capEl.classList.remove('swap'); }, 190);

    /* pills + hud */
    [...pillsEl.children].forEach((p, idx) => {
      p.className = 'pill' + (idx < i ? ' done' : idx === i ? ' cur' : '');
    });
    $('hudTitle').textContent = DATA.title || '';
    $('hudCount').textContent = `${i + 1} / ${steps.length}`;

    /* detail panel */
    renderRows(step);
    const want = userPanel === null ? (step.details && step.details.length > 0) : userPanel;
    panelEl.classList.toggle('open', !!want);
  };

  if (DATA.embedVideo && DATA.videoSrc) {
    /* video mode: hold the current frame, seek, then switch the overlays
       exactly when the new frame is decoded — highlight and frame in sync. */
    videoEl.style.display = 'block';
    sceneA.style.display = sceneB.style.display = 'none';
    if (playing) videoEl.pause();
    const gen = ++seekSeq;
    const ready = () => {
      videoEl.removeEventListener('seeked', ready);
      clearTimeout(seekGuard);
      if (gen !== seekSeq) return;      /* a newer cue superseded this seek */
      applyOverlays();
      if (playing) {
        videoEl.play().then(() => scheduleNext()).catch(() => stopPlay());
      }
    };
    const seekGuard = setTimeout(ready, 1500);   /* never stall >1.5s */
    if (Math.abs(videoEl.currentTime - step.t) < 0.05 && videoEl.readyState >= 2) {
      ready();
    } else {
      videoEl.addEventListener('seeked', ready);
      videoEl.currentTime = step.t;
    }
    return;
  }

  showScene(step);
  applyOverlays();
  if (playing) scheduleNext();
}

function renderRows(step) {
  rowsEl.innerHTML = '';
  (step.details || []).forEach(d => {
    const row = document.createElement('div');
    row.className = 'row';
    const dt = document.createElement('dt'); dt.textContent = d.label;
    const dd = document.createElement('dd'); dd.textContent = d.value;
    row.appendChild(dt); row.appendChild(dd);
    rowsEl.appendChild(row);
  });
}

/* ── Autoplay: dwell per step, stop at the end ── */
function scheduleNext() {
  clearTimeout(playTimer);
  if (!playing) return;
  playTimer = setTimeout(() => {
    if (cur >= steps.length - 1) { stopPlay(); return; }
    goTo(cur + 1);
  }, (steps[cur] && steps[cur].dwell || DWELL) * 1000);
}
function startPlay() {
  playing = true;
  $('playBtn').classList.add('on');
  $('playBtn').textContent = '❚❚';
  if (cur >= steps.length - 1) goTo(0, { force: true });
  else goTo(cur + 1);   // advance immediately — waiting a full dwell reads as "broken"
}
function stopPlay() {
  playing = false;
  clearTimeout(playTimer);
  $('playBtn').classList.remove('on');
  $('playBtn').textContent = '▶▶';
  if (DATA.embedVideo && DATA.videoSrc) videoEl.pause();
}

/* ── Picker mode: drag a rect in recording coords, output config JSON ── */
function toRec(e) {
  const rect = frameEl.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - rect.left) / SCALE),
    y: Math.round((e.clientY - rect.top) / SCALE)
  };
}
function togglePick() {
  picking = !picking;
  frameEl.classList.toggle('picking', picking);
  pickLogEl.classList.toggle('on', picking);
  $('pickBtn').classList.toggle('on', picking);
}
let dragStart = null;
frameEl.addEventListener('mousedown', e => {
  if (!picking) return;
  if (e.target.closest('#controls,#pills,#panel,#pickLog')) return;
  e.preventDefault();                       // stop native img drag swallowing mouseup
  dragStart = toRec(e);
  pickBoxEl.style.display = 'block';
  updatePickBox(dragStart, dragStart);
});
frameEl.addEventListener('mousemove', e => {
  if (!picking || !dragStart) return;
  updatePickBox(dragStart, toRec(e));
});
window.addEventListener('mouseup', e => {
  if (!picking || !dragStart) return;
  const end = toRec(e);
  const r = normRect(dragStart, end);
  dragStart = null;
  pickBoxEl.style.display = 'none';
  if (r.w < 8 || r.h < 8) return;          // treat tiny drags as noise
  const out = { step: cur, t: steps[cur].t, target: { x: r.x, y: r.y, w: r.w, h: r.h } };
  const line = JSON.stringify(out);
  pickLogEl.textContent += line + '\n';
  pickLogEl.scrollTop = pickLogEl.scrollHeight;
  if (navigator.clipboard) navigator.clipboard.writeText(line).catch(() => {});
});
function updatePickBox(a, b) {
  const r = normRect(a, b);
  pickBoxEl.style.left = r.x + 'px';
  pickBoxEl.style.top = r.y + 'px';
  pickBoxEl.style.width = r.w + 'px';
  pickBoxEl.style.height = r.h + 'px';
}
function normRect(a, b) {
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  return { x, y, w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) };
}

/* ── Wiring ── */
$('prevBtn').addEventListener('click', () => { stopPlay(); goTo(cur - 1); });
$('nextBtn').addEventListener('click', () => { stopPlay(); goTo(cur + 1); });
$('playBtn').addEventListener('click', () => playing ? stopPlay() : startPlay());
$('replayBtn').addEventListener('click', () => { stopPlay(); goTo(0, { force: true }); });
/* keep the chrome honest: the demo cannot outlive the video */
videoEl.addEventListener('ended', () => { if (playing) stopPlay(); });
$('pickBtn').addEventListener('click', togglePick);
$('hideBtn').addEventListener('click', () => {
  userPanel = !panelEl.classList.contains('open');
  panelEl.classList.toggle('open', userPanel);
});
pillsEl.addEventListener('click', e => {
  const pills = [...pillsEl.children];
  const idx = pills.indexOf(e.target);
  if (idx >= 0) { stopPlay(); goTo(idx, { force: true }); }
});
frameEl.addEventListener('click', e => {
  if (picking) return;
  if (e.target.closest('#controls,#pills,#panel,#pickLog,#caption')) return;
  stopPlay();
  goTo(cur + 1);
});
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); stopPlay(); goTo(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); stopPlay(); goTo(cur - 1); }
  else if (e.key === 'Home') { stopPlay(); goTo(0, { force: true }); }
  else if (e.key === 'End') { stopPlay(); goTo(steps.length - 1, { force: true }); }
  else if (e.key === 'f' || e.key === 'F') { playing ? stopPlay() : startPlay(); }
  else if (e.key === 'd' || e.key === 'D') { $('hideBtn').click(); }
  else if (e.key === 'p' || e.key === 'P') { togglePick(); }
  else if (e.key === 'r' || e.key === 'R') { stopPlay(); goTo(0, { force: true }); }
  else if (e.key === 'Escape') { if (picking) togglePick(); }
});

/* ── Boot ── */
(function boot() {
  steps.forEach(() => {
    const b = document.createElement('button');
    b.className = 'pill';
    b.title = '';
    pillsEl.appendChild(b);
  });
  $('hudTitle').textContent = DATA.title || '';
  if (DATA.embedVideo && DATA.videoSrc) videoEl.src = DATA.videoSrc;
  layout();
  goTo(0, { force: true });
})();
</script>
</body>
</html>
