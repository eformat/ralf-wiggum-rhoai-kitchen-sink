        - name: "24 | eval-api.adoc | Base URL and versioning"
          ansible.builtin.shell: |
            set -a
            [ -f "{{ logdir }}/env" ] && . "{{ logdir }}/env"
            set +a
            export EVALHUB_URL=https://$(oc get routes evalhub -o jsonpath='{.spec.host}' -n abc123-evalhub)
          args:
            executable: /bin/bash
            chdir: "{{ workdir }}"
          register: r24
          changed_when: false
          failed_when:
            - r24.rc != 0
            - "'AlreadyExists' not in (r24.stderr | default(''))"
            - "'already exists' not in (r24.stderr | default(''))"
            - "'NotFound' not in (r24.stderr | default(''))"
        - name: "24 | persist exports"
          ansible.builtin.shell: |
            cat > "{{ logdir }}/exports-24.sh" <<'QAENV'
            export EVALHUB_URL=https://$(oc get routes evalhub -o jsonpath='{.spec.host}' -n abc123-evalhub)
            QAENV
            cat "{{ logdir }}/exports-24.sh" >> "{{ logdir }}/env"
          changed_when: false
      always:
        - name: "24 | save log"
          ansible.builtin.copy:
            content: |
              # eval-api.adoc — Base URL and versioning
              {{ r24.rc | default('?') }}
              {{ r24.stdout | default('') }}
              {{ r24.stderr | default('') }}
            dest: "{{ logdir }}/24.log"
