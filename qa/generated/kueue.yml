            set +a
            oc get workloads -n abc123-user1
          args:
            executable: /bin/bash
            chdir: "{{ workdir }}"
          register: r21
          changed_when: false
          failed_when:
            - r21.rc != 0
            - "'AlreadyExists' not in (r21.stderr | default(''))"
            - "'already exists' not in (r21.stderr | default(''))"
            - "'NotFound' not in (r21.stderr | default(''))"
      always:
        - name: "21 | save log"
          ansible.builtin.copy:
            content: |
              # module-02-hands-on.adoc — Clean up
              {{ r21.rc | default('?') }}
              {{ r21.stdout | default('') }}
              {{ r21.stderr | default('') }}
            dest: "{{ logdir }}/21.log"
